mrs_uav_managers:

  estimation_manager:

    # loaded state estimator plugins
    state_estimators: [
      "rtk",
      "gps_baro",
    ]

    initial_state_estimator: "rtk" # will be used as the first state estimator
    agl_height_estimator: "" # only slightly filtered height for checking min height (not used in control feedback)

  control_manager:

    LeaderFollowerController:
      address: "leader_follower_controller_plugin/LeaderFollowerController"
      namespace: "leader_follower_controller"
      eland_threshold: 0.0 # [m], position error triggering eland
      failsafe_threshold: 0.0 # [m], position error triggering failsafe land
      odometry_innovation_threshold: 1.5 # [m], position odometry innovation threshold
      human_switchable: true

      # which outputs the controller can provide
      outputs:
        actuators:             false
        control_group:         false
        attitude_rate:         false
        attitude:              true
        acceleration_hdg_rate: false
        acceleration_hdg:      false
        velocity_hdg_rate:     false
        velocity_hdg:          false
        position:              false

    # list of names of dynamically loaded controllers
    controllers : [
      # "mpc_controller",
      "LeaderFollowerController",
    ]

    safety:
      # handoff directly to RC control
      # * overrides eland and failsafe landing
      # * recommended when flying over water
      rc_emergency_handoff:
        enabled: true

  uav_manager:

    takeoff:
      after_takeoff:
        # controller: "LeaderFollowerController"
        controller: "MpcController"

      takeoff_height: 5.0

