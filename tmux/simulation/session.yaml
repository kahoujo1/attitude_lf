# do not modify these
root: ./
name: simulation
socket_name: mrs
attach: false
tmux_options: -f /etc/ctu-mrs/tmux.conf
# you can modify these
pre_window: export RUN_TYPE=simulation; export GUI=false; export UAV_TYPE=f450; export UAV_NUM_1=1; export UAV_NUM_2=2; export UAV_NUM_3=3; export UAV_NAME_1=uav$UAV_NUM_1; export UAV_NAME_2=uav$UAV_NUM_2; export UAV_NAME_3=uav$UAV_NUM_3; export PLATFORM_CONFIG=`rospack find mrs_uav_gazebo_simulation`/config/mrs_uav_system/$UAV_TYPE.yaml; export WORLD_CONFIG=./config/world_config.yaml; export NETWORK_CONFIG=./config/network_config.yaml
startup_window: status
windows:
  - roscore:
      layout: tiled
      panes:
        - roscore
  - gazebo:
      layout: tiled
      panes:
        - waitForRos; roslaunch mrs_uav_gazebo_simulation simulation.launch world_name:=grass_plane gui:=$GUI
        - waitForGazebo; rosservice call /mrs_drone_spawner/spawn "$UAV_NUM_1 --$UAV_TYPE --enable-rangefinder --enable-ground-truth --pos 0 0 0 0"
        - waitForGazebo; rosservice call /mrs_drone_spawner/spawn "$UAV_NUM_2 --$UAV_TYPE --enable-rangefinder --enable-ground-truth --pos 5 0 0 0"
        - waitForGazebo; rosservice call /mrs_drone_spawner/spawn "$UAV_NUM_3 --$UAV_TYPE --enable-rangefinder --enable-ground-truth --pos -5 5 0 0"
        - export UAV_NAME=uav1; waitForControl; gz camera -c gzclient_camera -f $UAV_NAME; history -s gz camera -c gzclient_camera -f $UAV_NAME
  - status:
      layout: tiled
      panes:
        - export UAV_NAME=$UAV_NAME_1; waitForHw; roslaunch mrs_uav_status status.launch
        - export UAV_NAME=$UAV_NAME_2; waitForHw; roslaunch mrs_uav_status status.launch
        - export UAV_NAME=$UAV_NAME_3; waitForHw; roslaunch mrs_uav_status status.launch
  - hw_api:
      layout: tiled
      panes:
        -  export UAV_NAME=$UAV_NAME_1; waitForTime; roslaunch mrs_uav_px4_api api.launch
        -  export UAV_NAME=$UAV_NAME_2; waitForTime; roslaunch mrs_uav_px4_api api.launch
        -  export UAV_NAME=$UAV_NAME_3; waitForTime; roslaunch mrs_uav_px4_api api.launch
  - core:
      layout: tiled
      panes:
        - export UAV_NAME=$UAV_NAME_1; waitForHw; roslaunch mrs_uav_core core.launch
          custom_config:=./config/custom_config_follower.yaml
        - export UAV_NAME=$UAV_NAME_2; waitForHw; roslaunch mrs_uav_core core.launch
          custom_config:=./config/custom_config_leader.yaml
        - export UAV_NAME=$UAV_NAME_3; waitForHw; roslaunch mrs_uav_core core.launch
          custom_config:=./config/custom_config_leader.yaml
  - tf_connector:
      layout: tiled
      panes:
        - waitForTime; roslaunch mrs_tf_connector tf_connector.launch custom_config:=./config/tf_connector.yaml
  - automatic_start:
      layout: tiled
      panes:
        - export UAV_NAME=$UAV_NAME_1; waitForHw; roslaunch mrs_uav_autostart automatic_start.launch
        - export UAV_NAME=$UAV_NAME_2; waitForHw; roslaunch mrs_uav_autostart automatic_start.launch
        - export UAV_NAME=$UAV_NAME_3; waitForHw; roslaunch mrs_uav_autostart automatic_start.launch
  - takeoff:
      layout: tiled
      panes:
        - export UAV_NAME=$UAV_NAME_1; waitForControl; rosservice call /$UAV_NAME/hw_api/arming 1; sleep 2; rosservice call /$UAV_NAME/hw_api/offboard
        - export UAV_NAME=$UAV_NAME_2; waitForControl; rosservice call /$UAV_NAME/hw_api/arming 1; sleep 2; rosservice call /$UAV_NAME/hw_api/offboard        
        - export UAV_NAME=$UAV_NAME_3; waitForControl; rosservice call /$UAV_NAME/hw_api/arming 1; sleep 2; rosservice call /$UAV_NAME/hw_api/offboard
  - target_trajectory:
      layout: tiled
      panes:
        - export UAV_NAME=$UAV_NAME_2; waitForTakeoff; roslaunch leader_follower_controller_plugin start_tracking.launch
  - rviz:
      layout: tiled
      panes:
        - export UAV_NAME=$UAV_NAME_1; waitForControl; rosrun rviz rviz -d ./config/rviz.rviz
        - export UAV_NAME=$UAV_NAME_1; waitForControl; roslaunch mrs_rviz_plugins rviz_interface.launch
  - rviz_uav_models:
      layout: tiled
      panes:
        - export UAV_NAME=$UAV_NAME_1; waitForControl; roslaunch mrs_rviz_plugins load_robot.launch
        - export UAV_NAME=$UAV_NAME_2; waitForControl; roslaunch mrs_rviz_plugins load_robot.launch
        - export UAV_NAME=$UAV_NAME_3; waitForControl; roslaunch mrs_rviz_plugins load_robot.launch
  # - dynamic_reconfigure:
  #     layout: tiled
  #     panes:
  #       - export UAV_NAME=$UAV_NAME_1; waitForControl; rosrun rqt_reconfigure rqt_reconfigure
  - plotJuggler:
      layout: tiled
      panes:
        - export UAV_NAME=$UAV_NAME_2; waitForControl; rosrun plotjuggler plotjuggler -l ./plt_juggler_sim.xml
  - rosbags:
      layout: tiled
      panes:
        - export UAV_NAME=$UAV_NAME_1; waitForTakeoff; rosbag record -a -O /media/josef/Kahounovi/PEPA_FEL/simulation_rosbags/real_life_sim.bag
  - slowdown:
      layout: tiled
      panes:
        - export UAV_NAME=$UAV_NAME_2; waitForControl; ./../../../set_realtime_factor.sh 0.25
